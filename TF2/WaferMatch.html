<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Wafer Match Tool</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f5f5f5; margin: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
  #toolbar { background: white; padding: 12px; width: 100%; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  #scale-shell { width: 100%; display: flex; justify-content: center; align-items: flex-start; }
  #main-wrap { display: flex; align-items: flex-start; gap: 20px; margin: 20px; transform-origin: top center; flex-shrink: 0; }
  #canvas-container { position: relative; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; }

  /* 固定即時顯示區（緊貼主畫面右側） */
  #live-panel {
    width: 960px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: sticky;
    top: 80px;
  }
  #live-panel h3 {
    margin: 0 0 6px 0;
    font-size: 13px;
    color: #888;
    letter-spacing: 0.08em;
    align-self: flex-start;
  }
  #live-title {
    font-size: 16px;
    font-weight: bold;
    color: #1976D2;
    margin-bottom: 10px;
    text-align: center;
  }
  #liveCanvas {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0,0,0,0.06);
  }
  #live-info {
    font-size: 13px;
    color: #D32F2F;
    font-weight: bold;
    margin-top: 8px;
    min-height: 18px;
    text-align: center;
  }
  #live-hint {
    font-size: 11px;
    color: #999;
    margin-top: 6px;
    text-align: center;
  }
  .ctrl-group { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; }
  select, input { padding: 6px; border-radius: 4px; border: 1px solid #ccc; background: #fff; }
  button { padding: 8px 16px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; transition: all 0.2s; }
  #btn-mgr { background: #FFCA28; color: #333; }
  #btn-mgr:hover { background: #FFB300; }
  #btn-clear-all { background: #F44336; color: white; }
  #btn-clear-all:hover { background: #D32F2F; }
  #btn-undo { background: #9E9E9E; color: white; }
  #btn-undo:hover { background: #757575; }
  canvas { display: block; }
  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
  .modal-content { background: white; margin: 30px auto; padding: 25px; border-radius: 12px; width: 95%; max-width: 1080px; text-align: center; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .close { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #666; }
  .mgr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
  .preview-box { width: 120px; height: 120px; background: #eee; margin: 15px auto; border: 1px solid #666; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 50%; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
  .preview-box img { width: 104%; height: 104%; object-fit: cover; }
  .mgr-card { border: 2px solid #e0e0e0; padding: 20px 15px 15px; border-radius: 12px; background: #ffffff; cursor: pointer; transition: all 0.2s; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .mgr-card.selected { border-color: #2196F3; background: #f8fbff; box-shadow: 0 0 15px rgba(33, 150, 243, 0.2); }
  .mgr-card:focus { outline: none; }
  .mgr-card::after { content: '點擊選取'; position: absolute; top: 8px; right: 12px; font-size: 11px; color: #bbb; background: #f0f0f0; padding: 2px 8px; border-radius: 10px; }
</style>
</head>
<body>

<div id="toolbar">
  <div class="ctrl-group">
    <select id="mode"><option value="FI5.X">FI5.X</option><option value="FI6.4">FI6.4</option></select>
  </div>
  <div class="ctrl-group">
    <label>CASS:</label><select id="cass"><option>A</option><option>B</option><option>C</option><option>D</option></select>
  </div>
  <div class="ctrl-group">
    <label>SIDE:</label><select id="side"><option>S1</option><option>S2</option></select>
  </div>
  <div class="ctrl-group">
    <label>目標:</label><select id="station"><option value="LL">LL</option><option value="CHA">CHA</option><option value="CHB">CHB</option><option value="CHC">CHC</option></select>
  </div>
  <div class="ctrl-group">
    <label>Offset:</label><input type="number" id="offset" value="0" style="width: 55px;">
  </div>
  <button id="btn-mgr" onclick="toggleModal('mgrModal', true)">雙 MAP 管理</button>
  <button id="btn-undo" onclick="undo()">復原</button>
  <button id="btn-clear-all" onclick="clearAllImages()">清除全部貼圖</button>
</div>

<div id="scale-shell">
  <div id="main-wrap">
    <div id="canvas-container">
      <canvas id="mainCanvas"></canvas>
    </div>

    <div id="live-panel">
      <h3>即時放大圖</h3>
      <div id="live-title">hover 節點以顯示</div>
      <canvas id="liveCanvas" width="920" height="460"></canvas>
      <div id="live-info"></div>
      <div id="live-hint">滑鼠移到任一節點上即可</div>
    </div>
  </div>
</div>

<div id="zoomModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="toggleModal('zoomModal', false)">&times;</span>
    <h3 id="zoomTitle" style="margin-bottom: 15px;">Node: -- | Source: --</h3>
    <div style="position: relative; width: 1000px; height: 500px; margin: 0 auto; max-width: 100%;">
      <canvas id="zoomCanvas" width="1000" height="500" style="background: #fff; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.1); max-width: 100%; height: auto;"></canvas>
    </div>
    <p id="zoomInfo" style="font-size: 20px; margin-top: 20px; color: #D32F2F; font-weight: bold;"></p>
  </div>
</div>

<div id="mgrModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="toggleModal('mgrModal', false)">&times;</span>
    <h2>雙 MAP 管理 (S1/S2)</h2>
    <div class="mgr-grid">
      <div class="mgr-card selected" id="card-S1" tabindex="0" onclick="selectSide('S1')">
        <h3>S1 (Left Arm)</h3>
        <div class="preview-box" id="pre-S1">尚未載入</div>
        <button onclick="event.stopPropagation(); document.getElementById('file-S1').click()">上傳</button>
        <button onclick="event.stopPropagation(); pasteToSide('S1')">貼上</button>
        <button onclick="event.stopPropagation(); clearImg('S1')">清除</button>
        <input type="file" id="file-S1" hidden onchange="handleFile(this, 'S1')">
      </div>
      <div class="mgr-card" id="card-S2" tabindex="0" onclick="selectSide('S2')">
        <h3>S2 (Right Arm)</h3>
        <div class="preview-box" id="pre-S2">尚未載入</div>
        <button onclick="event.stopPropagation(); document.getElementById('file-S2').click()">上傳</button>
        <button onclick="event.stopPropagation(); pasteToSide('S2')">貼上</button>
        <button onclick="event.stopPropagation(); clearImg('S2')">清除</button>
        <input type="file" id="file-S2" hidden onchange="handleFile(this, 'S2')">
      </div>
    </div>
  </div>
</div>

<script>
const REF_W = 600, REF_H = 850, REF_WAFER_R = 45;

const FI_WAFER_POS = {
  "FI_L": [155, 565],
  "FI_R": [445, 565]
};

const RAW_WAFER_POS = {
  "A2": [245, 105], "A1": [355, 105], "B1": [135, 215], "B2": [135, 325],
  "C2": [465, 215], "C1": [465, 325], "MF1": [245, 325], "MF2": [355, 325],
  "LL1": [200, 435], "LL2": [400, 435], "CS": [300, 565],
  "CA": [150, 720], "CB": [250, 720], "CC": [350, 720], "CD": [450, 720]
};

const RAW_MODULE_BOXES = {
  "CHA": [190, 50, 410, 160], "CHB": [80, 160, 190, 380], "CHC": [410, 160, 520, 380],
  "MF": [190, 160, 410, 380], "LL": [80, 380, 520, 490], "Cooling": [250, 490, 350, 640],
  "CassA": [100, 640, 200, 770], "CassB": [200, 640, 300, 770], "CassC": [300, 640, 400, 770], "CassD": [400, 640, 500, 770]
};

const RAW_LABEL_POS = {
  "CHA": [300, 70], "CHB": [135, 270], "CHC": [465, 270], "MF": [300, 210],
  "LL": [300, 400], "Cooling": [300, 510], "CassA": [150, 650], "CassB": [250, 650], "CassC": [350, 650], "CassD": [450, 650]
};

const FI_R89 = 26.7;
const FI_R96 = 28.8;
const FI_PAD_W = 7.2;
const FI_PAD_H = 2.2;
const FI_EXT_PAD_R = 45.6;
const FI_EXT_PAD_W = 2.0;
const FI_EXT_PAD_H = 5.3;
const FI_SENSOR_DIST = 49.0;
const FI_SENSOR_R = 4.1;

let waferImages = { S1: null, S2: null };
let historyStack = [];
let selectedSide = 'S1';
let clickableRegions = [];
let currentLiveReg = null;
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

function getNodeAngle(mode, nodeName, cassName, side, startAngle) {
  if (["CA", "CB", "CC", "CD"].includes(nodeName)) return (startAngle) % 360;
  let lookupName = (nodeName === "MF1") ? "LL1" : (nodeName === "MF2" ? "LL2" : nodeName);
  let rules = {};
  if (mode === "FI5.X") {
    if (["A", "B"].includes(cassName)) {
      rules = (side === "S1")
        ? {"LL1": 210, "A1": 30, "B1": 300, "C1": 120, "CS": 0, "FI_L": 180, "FI_R": 180}
        : {"CS": 280, "LL2": 0, "A2": 180, "B2": 90, "C2": 270, "FI_L": 180, "FI_R": 20};
    } else {
      rules = (side === "S1")
        ? {"CS": 80, "LL1": 0, "A1": 180, "B1": 90, "C1": 270, "FI_L": 340, "FI_R": 180}
        : {"LL2": 150, "A2": 330, "B2": 240, "C2": 60, "CS": 0, "FI_L": 180, "FI_R": 180};
    }
  } else {
    if (["A", "B"].includes(cassName)) {
      rules = (side === "S1")
        ? {"LL1": 190, "A1": 10, "B1": 280, "C1": 100, "CS": 0,   "FI_L": 180, "FI_R": 180}
        : {"CS": 262, "LL2": 335, "A2": 155, "B2": 65, "C2": 245,  "FI_L": 180, "FI_R": 345};
    } else {
      rules = (side === "S1")
        ? {"CS": 98, "LL1": 25, "A1": 205, "B1": 115, "C1": 295,   "FI_L": 15,  "FI_R": 180}
        : {"LL2": 170, "A2": 350, "B2": 260, "C2": 80, "CS": 0,    "FI_L": 180, "FI_R": 180};
    }
  }
  return ( (rules[lookupName] || 0) + startAngle ) % 360;
}

function getFullPath(cassName, side, station) {
  let path = [`C${cassName}`];
  if ((["A", "B"].includes(cassName) && side === "S2") || (["C", "D"].includes(cassName) && side === "S1")) path.push("CS");
  path.push(side === "S1" ? "LL1" : "LL2");
  if (station !== "LL") {
    path.push(side === "S1" ? "MF1" : "MF2");
    let target = {"CHA":"A", "CHB":"B", "CHC":"C"}[station];
    path.push(`${target}${side === "S1" ? '1' : '2'}`);
  }
  return path;
}

function draw() {
  canvas.width = REF_W; canvas.height = REF_H;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  clickableRegions = [];

  const mode = document.getElementById('mode').value,
        selC = document.getElementById('cass').value,
        selS = document.getElementById('side').value,
        selSt = document.getElementById('station').value,
        baseAngle = parseInt(document.getElementById('offset').value) || 0;

  const pathS1 = getFullPath(selC, "S1", selSt),
        pathS2 = getFullPath(selC, "S2", selSt);

  ctx.strokeStyle = "#0015D1"; ctx.lineWidth = 1.5; ctx.fillStyle = "#5C6BC0";
  ctx.font = "bold 13px Segoe UI"; ctx.textAlign = "center";
  for (let name in RAW_MODULE_BOXES) {
    let b = RAW_MODULE_BOXES[name];
    ctx.strokeRect(b[0], b[1], b[2]-b[0], b[3]-b[1]);
    let lp = RAW_LABEL_POS[name] || [(b[0]+b[2])/2, b[1]+18];
    ctx.fillText(name, lp[0], lp[1]);
  }

  for (let name in RAW_WAFER_POS) {
    let [cx, cy] = RAW_WAFER_POS[name];
    let showS1 = pathS1.includes(name) && (waferImages.S1 || selS === "S1"),
        showS2 = pathS2.includes(name) && (waferImages.S2 || selS === "S2");
    let sideToDraw = (showS1 && showS2) ? selS : (showS1 ? "S1" : (showS2 ? "S2" : null)),
        isInPath = sideToDraw !== null;
    let angle = getNodeAngle(mode, name, selC, sideToDraw || selS, baseAngle),
        displayAngle = (180 + angle) % 360;

    // Natural side: "1"-suffix nodes are always S1, "2"-suffix always S2, shared nodes follow selS.
    // This ensures every empty circle shows the correct pre-positioned notch for its own side+CASS,
    // regardless of which side is currently selected.
    const notchSide = name.endsWith("1") ? "S1" : name.endsWith("2") ? "S2" : selS;
    const notchDisplayAngle = (180 + getNodeAngle(mode, name, selC, notchSide, baseAngle)) % 360;

    ctx.beginPath(); ctx.arc(cx, cy, REF_WAFER_R, 0, Math.PI * 2);
    ctx.fillStyle = isInPath ? "white" : "#F0F4F7"; ctx.fill();
    ctx.strokeStyle = "#BDC3C7"; ctx.lineWidth = 1; ctx.stroke();

    if (isInPath && waferImages[sideToDraw]) {
      drawClippedWafer(ctx, waferImages[sideToDraw], cx, cy, REF_WAFER_R, displayAngle);
    } else {
      ctx.fillStyle = isInPath ? "#2C3E50" : "#BDC3C7";
      ctx.font = "11px Segoe UI";
      ctx.fillText(name, cx, cy + 4);
    }

    drawNotch(ctx, cx, cy, REF_WAFER_R, notchDisplayAngle);

    if (isInPath) {
      ctx.beginPath(); ctx.arc(cx, cy, REF_WAFER_R + 1.5, 0, Math.PI * 2);
      ctx.strokeStyle = "#D32F2F"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#D32F2F"; ctx.font = "bold 13px Segoe UI";
      ctx.fillText(`${angle}°`, cx, cy - REF_WAFER_R - 10);
    }
    clickableRegions.push({ name, cx, cy, angle, side: sideToDraw || selS, isFI: false });
  }

  for (let fiName in FI_WAFER_POS) {
    let [cx, cy] = FI_WAFER_POS[fiName];
    let fiSide = (fiName === "FI_L") ? "S1" : "S2";
    let hasImg = waferImages[fiSide] !== null;
    let angle = getNodeAngle(mode, fiName, selC, fiSide, baseAngle);
    let displayAngle = (180 + angle) % 360;

    ctx.beginPath(); ctx.arc(cx, cy, REF_WAFER_R, 0, Math.PI * 2);
    ctx.fillStyle = hasImg ? "white" : "#F0F4F7"; ctx.fill();
    ctx.strokeStyle = "#BDC3C7"; ctx.lineWidth = 1; ctx.stroke();

    if (hasImg) {
      drawClippedWafer(ctx, waferImages[fiSide], cx, cy, REF_WAFER_R, displayAngle);
    } else {
      ctx.fillStyle = "#546E7A";
      ctx.font = "bold 11px Segoe UI";
      ctx.fillText(`FI ${fiSide}`, cx, cy + 4);
    }

    drawNotch(ctx, cx, cy, REF_WAFER_R, displayAngle);

    ctx.beginPath(); ctx.arc(cx, cy, REF_WAFER_R + 1.5, 0, Math.PI * 2);
    ctx.strokeStyle = "#1976D2"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#1976D2"; ctx.font = "bold 13px Segoe UI";
    ctx.fillText(`FI ${fiSide}  ${angle}°`, cx, cy - REF_WAFER_R - 10);

    clickableRegions.push({ name: `FI_${fiSide}`, cx, cy, angle, side: fiSide, isFI: true });
  }

  if (currentLiveReg) {
    const latest = clickableRegions.find(r => r.name === currentLiveReg.name && r.side === currentLiveReg.side);
    if (latest) updateLivePanel(latest);
  }
}

function drawNotch(ctx, cx, cy, r, displayAngle) {
  let notchRad = ( (90 + displayAngle) * Math.PI ) / 180;
  let ex = cx + r * Math.cos(notchRad);
  let ey = cy + r * Math.sin(notchRad);
  let p1x = cx + (r - 9) * Math.cos(notchRad);
  let p1y = cy + (r - 9) * Math.sin(notchRad);
  ctx.beginPath();
  ctx.moveTo(p1x, p1y);
  ctx.lineTo(ex + 4 * Math.sin(notchRad), ey - 4 * Math.cos(notchRad));
  ctx.lineTo(ex - 4 * Math.sin(notchRad), ey + 4 * Math.cos(notchRad));
  ctx.closePath();
  ctx.fillStyle = "rgba(244, 67, 54, 0.5)"; ctx.fill();
}

function drawArchContact(ctx, cx, cy, r, deg) {
  const W = 20;
  const H = 30;
  const R = W / 2;
  const rad = (deg - 90) * Math.PI / 180;
  const ax = cx + r * Math.cos(rad);
  const ay = cy + r * Math.sin(rad);

  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(rad - Math.PI / 2);
  ctx.setLineDash([]);

  function buildPath() {
    ctx.beginPath();
    ctx.moveTo(-W/2, H/2);
    ctx.lineTo( W/2, H/2);
    ctx.lineTo( W/2, -H/2 + R);
    ctx.arc(0, -H/2 + R, R, 0, Math.PI, true);
    ctx.lineTo(-W/2, H/2);
  }

  buildPath();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 4.5;
  ctx.stroke();

  buildPath();
  ctx.strokeStyle = "#D32F2F";
  ctx.lineWidth = 2.2;
  ctx.stroke();

  ctx.restore();
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (REF_W / rect.width),
        y = (e.clientY - rect.top) * (REF_H / rect.height);
  for (let reg of clickableRegions) {
    if (Math.sqrt((x - reg.cx)**2 + (y - reg.cy)**2) < REF_WAFER_R) { updateLivePanel(reg); break; }
  }
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (REF_W / rect.width),
        y = (e.clientY - rect.top) * (REF_H / rect.height);
  let hit = null;
  for (let reg of clickableRegions) {
    if (Math.sqrt((x - reg.cx)**2 + (y - reg.cy)**2) < REF_WAFER_R) { hit = reg; break; }
  }
  if (hit) {
    canvas.style.cursor = 'pointer';
    updateLivePanel(hit);
  } else {
    canvas.style.cursor = 'default';
  }
});

function siblingForSide(name, side) {
  const swap = {
    "LL1":"LL2","A1":"A2","B1":"B2","C1":"C2","MF1":"MF2",
    "LL2":"LL1","A2":"A1","B2":"B1","C2":"C1","MF2":"MF1"
  };
  if (!swap[name]) return name;
  const naturalSide = name.endsWith("1") ? "S1" : "S2";
  return naturalSide === side ? name : swap[name];
}

function renderZoomView(ctx, canvasW, canvasH, reg) {
  ctx.clearRect(0, 0, canvasW, canvasH);
  const currentMode = document.getElementById('mode').value;

  const singleSideOnly = reg.isFI || ["CA","CB","CC","CD"].includes(reg.name);

  if (singleSideOnly) {
    const halfW = canvasW / 2;
    renderZoomPanel(ctx, halfW / 2, halfW, canvasH, reg, reg.side, reg.angle, false, reg.name);
  } else {
    const cassName = document.getElementById('cass').value;
    const baseAngle = parseInt(document.getElementById('offset').value) || 0;
    const nameS1 = siblingForSide(reg.name, "S1");
    const nameS2 = siblingForSide(reg.name, "S2");
    // CS notch reflects FI ROBOT's actual placement:
    //   S1 panel uses CassA/B S2 rule (S2 only reaches CS via A/B)
    //   S2 panel uses CassC/D S1 rule (S1 only reaches CS via C/D)
    // regardless of currently selected CASS.
    const cassS1 = reg.name === "CS" ? "A" : cassName;
    const cassS2 = reg.name === "CS" ? "C" : cassName;
    const sideForS1Angle = reg.name === "CS" ? "S2" : "S1";
    const sideForS2Angle = reg.name === "CS" ? "S1" : "S2";
    const angleS1 = getNodeAngle(currentMode, nameS1, cassS1, sideForS1Angle, baseAngle);
    const angleS2 = getNodeAngle(currentMode, nameS2, cassS2, sideForS2Angle, baseAngle);
    const halfW = canvasW / 2;
    renderZoomPanel(ctx, 0, halfW, canvasH, reg, "S1", angleS1, true, nameS1);
    renderZoomPanel(ctx, halfW, halfW, canvasH, reg, "S2", angleS2, true, nameS2);
    ctx.save();
    ctx.strokeStyle = "#cfd8dc"; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(halfW, 12); ctx.lineTo(halfW, canvasH - 12); ctx.stroke();
    ctx.restore();
  }

  if (reg.isFI || reg.name === "CS") {
    ctx.save();
    const labelW = Math.max(48, canvasW * 0.14), labelH = Math.max(18, canvasH * 0.052);
    const labelX = canvasW - labelW - 8;
    const labelY = 8;
    ctx.fillStyle = currentMode === "FI5.X" ? "#2196F3" : "#FF7043";
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5;
    ctx.fillRect(labelX, labelY, labelW, labelH);
    ctx.strokeRect(labelX, labelY, labelW, labelH);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + Math.max(10, canvasW/38) + "px 'Segoe UI', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(currentMode, labelX + labelW/2, labelY + labelH/2 + 1);
    ctx.restore();
  }
}

function renderZoomPanel(ctx, originX, panelW, panelH, reg, side, angle, showSideBadge, nodeName) {
  const currentMode = document.getElementById('mode').value;
  const img = waferImages[side];
  const name = nodeName || reg.name;

  const hasSV = ["A1","A2","B1","B2","C1","C2","LL1","LL2"].includes(name);
  const hasArch = ["LL1","LL2","CS"].includes(name);
  const hasFIOuter = reg.isFI;

  const scale0 = panelW / 500;
  const svBarH = hasSV ? 40 * scale0 : 0;
  const svTopMargin = hasSV ? 8 * scale0 : 0;
  const sideBadgeH = showSideBadge ? Math.max(20, 26 * scale0) : 0;
  const sideBadgeGap = showSideBadge ? 6 : 0;
  const reservedTop = sideBadgeH + sideBadgeGap
                    + (hasSV ? (svBarH + svTopMargin * 2) : 12);

  const archOuter = hasArch ? 20 : 0;
  const sidePadding = Math.max(archOuter, 14);

  const rFromW = (panelW - 2 * sidePadding) / 2;
  let rFromH;
  if (hasFIOuter) {
    rFromH = (panelH - reservedTop - 14) / 2.18;
  } else if (hasArch) {
    rFromH = (panelH - reservedTop - 30) / 2;
  } else {
    rFromH = (panelH - reservedTop - 12) / 2;
  }
  const wafer_zoom_r = Math.min(rFromH, rFromW);

  const cx = originX + panelW / 2;
  let topExtra = 0;
  if (name === "CS") topExtra = 20;
  const cy = reservedTop + topExtra + wafer_zoom_r;
  let displayAngleForZoom = (180 + angle) % 360;

  if (!reg.isFI) {
    let viewRotation = 0;
    if (["A1", "A2"].includes(name)) viewRotation = 180;
    else if (["B1", "B2"].includes(name)) viewRotation = -90;
    else if (["C1", "C2"].includes(name)) viewRotation = 90;
    displayAngleForZoom = (displayAngleForZoom + viewRotation + 360) % 360;
  }

  if (showSideBadge) {
    ctx.save();
    const badgeW = Math.max(80, 110 * scale0);
    const badgeY = 4;
    ctx.fillStyle = side === "S1" ? "#2E7D32" : "#1565C0";
    ctx.fillRect(cx - badgeW / 2, badgeY, badgeW, sideBadgeH);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + Math.max(12, 15 * scale0) + "px 'Segoe UI', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(`${side} · ${angle}°`, cx, badgeY + sideBadgeH / 2 + 1);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, wafer_zoom_r, 0, Math.PI * 2);
  ctx.fillStyle = "#fff"; ctx.fill();

  if (img) drawClippedWafer(ctx, img, cx, cy, wafer_zoom_r, displayAngleForZoom);

  ctx.beginPath(); ctx.arc(cx, cy, wafer_zoom_r, 0, Math.PI * 2);
  ctx.lineWidth = 1; ctx.strokeStyle = "black"; ctx.stroke();

  drawNotchScaled(ctx, cx, cy, wafer_zoom_r, displayAngleForZoom);

  if (reg.isFI) {
    if (currentMode === "FI5.X") {
      drawFIContactOverlayScaled_FI5X(ctx, cx, cy, wafer_zoom_r);
    } else {
      drawFIContactOverlayScaled_FI64(ctx, cx, cy, wafer_zoom_r);
    }
  } else {
    if (name === "CS") {
      if (currentMode === "FI5.X") {
        drawCSOverlayScaled_FI5X(ctx, cx, cy, wafer_zoom_r);
      } else {
        drawCSOverlayScaled_FI64(ctx, cx, cy, wafer_zoom_r);
      }
    }

    const sv_config = {
      "A1": 1,"A2": 1,"B1": 1,"B2": 1,"C1": 1,"C2": 1,"LL1": 1,"LL2": 1
    };
    if (sv_config[name]) {
      const barW = Math.min(300 * scale0, panelW - 2 * sidePadding);
      const barH = svBarH;
      const barY = sideBadgeH + sideBadgeGap + svTopMargin + barH / 2;
      ctx.save();
      ctx.translate(cx, barY);
      ctx.fillStyle = "#4AA3FF"; ctx.fillRect(-barW/2, -barH/2, barW, barH);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "white"; ctx.font = "bold " + Math.max(11, 16*scale0) + "px Arial";
      ctx.fillText("SLIT VALVE", 0, -barH*0.18);
      ctx.fillStyle = "black"; ctx.font = "bold " + Math.max(9, 13*scale0) + "px Arial";
      ctx.fillText(`${name} | ${angle}°`, 0, barH*0.22);
      ctx.restore();
    }

    if (name === "LL1") {
      [65, 130, 235, 270, 310].forEach(deg => drawArchContact(ctx, cx, cy, wafer_zoom_r, deg));
    }
    if (name === "LL2") {
      [220, 285, 45, 80, 120].forEach(deg => drawArchContact(ctx, cx, cy, wafer_zoom_r, deg));
    }

    if (["A1","A2","B1","B2","C1","C2"].includes(name)) {
      const offset110 = wafer_zoom_r * (110 / 150);
      const halfH = Math.sqrt(Math.max(0, wafer_zoom_r*wafer_zoom_r - offset110*offset110));
      ctx.save();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4.5; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(cx - offset110, cy - halfH); ctx.lineTo(cx - offset110, cy + halfH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + offset110, cy - halfH); ctx.lineTo(cx + offset110, cy + halfH); ctx.stroke();
      ctx.strokeStyle = "#D32F2F"; ctx.lineWidth = 2.2; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(cx - offset110, cy - halfH); ctx.lineTo(cx - offset110, cy + halfH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + offset110, cy - halfH); ctx.lineTo(cx + offset110, cy + halfH); ctx.stroke();
      ctx.restore();
    }

    if (name === "MF1" || name === "MF2") {
      const offset50 = wafer_zoom_r * (50 / 150);
      const halfH = Math.sqrt(Math.max(0, wafer_zoom_r*wafer_zoom_r - offset50*offset50));
      ctx.save();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(cx - offset50, cy - halfH); ctx.lineTo(cx - offset50, cy + halfH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + offset50, cy - halfH); ctx.lineTo(cx + offset50, cy + halfH); ctx.stroke();
      ctx.strokeStyle = "#1976D2"; ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(cx - offset50, cy - halfH); ctx.lineTo(cx - offset50, cy + halfH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + offset50, cy - halfH); ctx.lineTo(cx + offset50, cy + halfH); ctx.stroke();
      ctx.restore();
    }
  }
}

function drawFIContactOverlayScaled_FI5X(ctx, cx, cy, r) {
  const k = r / REF_WAFER_R;
  const R89 = FI_R89 * k;
  const R96 = FI_R96 * k;
  const SENSOR_DIST = FI_SENSOR_DIST * k;
  const SENSOR_R = FI_SENSOR_R * k;
  const EXT_PAD_R = FI_EXT_PAD_R * k;
  const EXT_PAD_W = FI_EXT_PAD_W * k;
  const EXT_PAD_H = FI_EXT_PAD_H * k;
  const PAD_THICK = R96 - R89;
  const PAD_NEAR  = 118 * r / 188;
  const PAD_FAR   = 148 * r / 188;
  const PAD_LEN   = PAD_FAR - PAD_NEAR;

  ctx.save();

  let halfH89 = Math.sqrt(Math.max(0, r*r - R89*R89));
  ctx.setLineDash([8, 5]); ctx.lineWidth = 2;
  ctx.strokeStyle = "#1144cc";
  ctx.beginPath(); ctx.moveTo(cx - R89, cy - halfH89); ctx.lineTo(cx - R89, cy + halfH89); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + R89, cy - halfH89); ctx.lineTo(cx + R89, cy + halfH89); ctx.stroke();

  let halfH96 = Math.sqrt(Math.max(0, r*r - R96*R96));
  ctx.setLineDash([]); ctx.strokeStyle = "#cc2222";
  ctx.beginPath(); ctx.moveTo(cx - R96, cy - halfH96); ctx.lineTo(cx - R96, cy + halfH96); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + R96, cy - halfH96); ctx.lineTo(cx + R96, cy + halfH96); ctx.stroke();

  ctx.fillStyle = "#b0b8d8"; ctx.strokeStyle = "#6677aa"; ctx.lineWidth = 1;
  ctx.fillRect(cx + R89, cy - PAD_FAR, PAD_THICK, PAD_LEN);
  ctx.strokeRect(cx + R89, cy - PAD_FAR, PAD_THICK, PAD_LEN);
  ctx.fillRect(cx - R96, cy - PAD_FAR, PAD_THICK, PAD_LEN);
  ctx.strokeRect(cx - R96, cy - PAD_FAR, PAD_THICK, PAD_LEN);

  ctx.beginPath();
  ctx.arc(cx, cy + SENSOR_DIST, SENSOR_R, 0, Math.PI * 2);
  ctx.strokeStyle = "#1144cc"; ctx.lineWidth = 1.5;
  ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.stroke();

  ctx.fillStyle = "#b0b8d8"; ctx.strokeStyle = "#6677aa"; ctx.lineWidth = 1;
  [80, 100].forEach(deg => {
    let a = deg * Math.PI / 180;
    let ex = cx + EXT_PAD_R * Math.cos(a);
    let ey = cy + EXT_PAD_R * Math.sin(a);
    ctx.save();
    ctx.translate(ex, ey); ctx.rotate(a);
    ctx.fillRect(-EXT_PAD_W/2, -EXT_PAD_H/2, EXT_PAD_W, EXT_PAD_H);
    ctx.strokeRect(-EXT_PAD_W/2, -EXT_PAD_H/2, EXT_PAD_W, EXT_PAD_H);
    ctx.restore();
  });

  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.restore();
}

function drawFIContactOverlayScaled_FI64(ctx, cx, cy, r) {
  const k = r / REF_WAFER_R;
  const R77 = 77 * (45 / 150) * k;
  const R85 = 85 * (45 / 150) * k;
  const SENSOR_DIST = FI_SENSOR_DIST * k;
  const SENSOR_R = FI_SENSOR_R * k;
  const EXT_PAD_R = FI_EXT_PAD_R * k;
  const EXT_PAD_W = FI_EXT_PAD_W * k;
  const EXT_PAD_H = FI_EXT_PAD_H * k;
  const PAD_THICK = R85 - R77;
  const halfH77 = Math.sqrt(Math.max(0, r*r - R77*R77));
  const halfH85 = Math.sqrt(Math.max(0, r*r - R85*R85));
  const PAD_LEN = 30 * r / 188;

  ctx.save();

  ctx.setLineDash([8, 5]); ctx.lineWidth = 2;
  ctx.strokeStyle = "#1144cc";
  ctx.beginPath(); ctx.moveTo(cx - R77, cy - halfH77); ctx.lineTo(cx - R77, cy + halfH77); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + R77, cy - halfH77); ctx.lineTo(cx + R77, cy + halfH77); ctx.stroke();

  ctx.setLineDash([]); ctx.strokeStyle = "#cc2222";
  ctx.beginPath(); ctx.moveTo(cx - R85, cy - halfH85); ctx.lineTo(cx - R85, cy + halfH85); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + R85, cy - halfH85); ctx.lineTo(cx + R85, cy + halfH85); ctx.stroke();

  ctx.fillStyle = "#b0b8d8"; ctx.strokeStyle = "#6677aa"; ctx.lineWidth = 1;
  const PAD_TOP_R = cy - halfH77;
  const PAD_TOP_L = cy - halfH77;
  ctx.fillRect(cx + R77, PAD_TOP_R, PAD_THICK, PAD_LEN);
  ctx.strokeRect(cx + R77, PAD_TOP_R, PAD_THICK, PAD_LEN);
  ctx.fillRect(cx - R85, PAD_TOP_L, PAD_THICK, PAD_LEN);
  ctx.strokeRect(cx - R85, PAD_TOP_L, PAD_THICK, PAD_LEN);

  ctx.beginPath();
  ctx.arc(cx, cy + SENSOR_DIST, SENSOR_R, 0, Math.PI * 2);
  ctx.strokeStyle = "#1144cc"; ctx.lineWidth = 1.5;
  ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.stroke();

  ctx.fillStyle = "#b0b8d8"; ctx.strokeStyle = "#6677aa"; ctx.lineWidth = 1;
  [80, 100].forEach(deg => {
    let a = deg * Math.PI / 180;
    let ex = cx + EXT_PAD_R * Math.cos(a);
    let ey = cy + EXT_PAD_R * Math.sin(a);
    ctx.save();
    ctx.translate(ex, ey); ctx.rotate(a);
    ctx.fillRect(-EXT_PAD_W/2, -EXT_PAD_H/2, EXT_PAD_W, EXT_PAD_H);
    ctx.strokeRect(-EXT_PAD_W/2, -EXT_PAD_H/2, EXT_PAD_W, EXT_PAD_H);
    ctx.restore();
  });

  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.restore();
}

function drawCSOverlayScaled_FI5X(ctx, cx, cy, r) {
  const contactAngles = [0, 155, 205];
  contactAngles.forEach(deg => drawArchContact(ctx, cx, cy, r, deg));
}

function drawCSOverlayScaled_FI64(ctx, cx, cy, r) {

  contactAngles.forEach(deg => drawArchContact(ctx, cx, cy, r, deg));
}

function drawNotchScaled(ctx, cx, cy, r, displayAngle) {
  let notchRad = ( (90 + displayAngle) * Math.PI ) / 180;
  let ex = cx + r * Math.cos(notchRad);
  let ey = cy + r * Math.sin(notchRad);
  let p1x = cx + (r - 36) * Math.cos(notchRad);
  let p1y = cy + (r - 36) * Math.sin(notchRad);
  ctx.beginPath();
  ctx.moveTo(p1x, p1y);
  ctx.lineTo(ex + 16 * Math.sin(notchRad), ey - 16 * Math.cos(notchRad));
  ctx.lineTo(ex - 16 * Math.sin(notchRad), ey + 16 * Math.cos(notchRad));
  ctx.closePath();
  ctx.fillStyle = "rgba(244, 67, 54, 0.5)"; ctx.fill();
}

// --- V23 robust wafer edge detection ---
// Strategy:
//   1. Sample 4 corners for screenshot background colour (median per channel).
//   2. Build a foreground mask via colour-distance threshold.
//   3. Take the largest connected component = the wafer disc.
//   4. Iteratively refine: radial scan from current centre to find boundary
//      points -> fit a circle (algebraic least squares with outlier reject).
//   5. Sample wafer interior for layout fill colour.
// Large images are downscaled to <=1024px for detection; results are scaled
// back. The render pass uses the detected centre+radius with shrink=1.0 so
// the wafer fits the layout circle exactly with no PA detail loss.

function _detect_sampleBackground(data, w, h) {
  const m = Math.max(2, Math.floor(Math.min(w, h) * 0.015));
  const size = Math.max(6, Math.floor(Math.min(w, h) * 0.05));
  const rs = [], gs = [], bs = [];
  const corners = [
    [m, m], [w - m - size, m], [m, h - size - m], [w - m - size, h - size - m]
  ];
  for (const [x0, y0] of corners) {
    for (let dy = 0; dy < size; dy += 2) {
      for (let dx = 0; dx < size; dx += 2) {
        const x = x0 + dx, y = y0 + dy;
        if (x < 0 || x >= w || y < 0 || y >= h) continue;
        const idx = (y * w + x) * 4;
        if (data[idx + 3] < 128) continue;
        rs.push(data[idx]); gs.push(data[idx + 1]); bs.push(data[idx + 2]);
      }
    }
  }
  if (rs.length === 0) return { r: 255, g: 255, b: 255 };
  rs.sort((a, b) => a - b); gs.sort((a, b) => a - b); bs.sort((a, b) => a - b);
  const m2 = rs.length >> 1;
  return { r: rs[m2], g: gs[m2], b: bs[m2] };
}

function _detect_buildMask(data, w, h, bg) {
  const mask = new Uint8Array(w * h);
  const T2 = 20 * 20;
  for (let p = 0; p < w * h; p++) {
    const i = p * 4;
    if (data[i + 3] < 50) continue;
    const dr = data[i] - bg.r, dg = data[i + 1] - bg.g, db = data[i + 2] - bg.b;
    if (dr * dr + dg * dg + db * db > T2) mask[p] = 1;
  }
  return mask;
}

function _detect_allComponents(mask, w, h) {
  const total = w * h;
  const visited = new Uint8Array(total);
  const stack = new Int32Array(total);
  const comps = [];

  for (let start = 0; start < total; start++) {
    if (!mask[start] || visited[start]) continue;
    let top = 0;
    stack[top++] = start;
    let size = 0, sumX = 0, sumY = 0;
    let minX = w, minY = h, maxX = 0, maxY = 0;
    const pixels = [];
    while (top > 0) {
      const p = stack[--top];
      if (visited[p] || !mask[p]) continue;
      visited[p] = 1;
      pixels.push(p);
      size++;
      const px = p % w;
      const py = (p - px) / w;
      sumX += px; sumY += py;
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
      if (px > 0)     stack[top++] = p - 1;
      if (px < w - 1) stack[top++] = p + 1;
      if (py > 0)     stack[top++] = p - w;
      if (py < h - 1) stack[top++] = p + w;
    }
    comps.push({ size, sumX, sumY, minX, minY, maxX, maxY, pixels });
  }
  return comps;
}

function _detect_pickWaferComponent(comps, w, h) {
  if (comps.length === 0) return null;
  const minSize = Math.max(200, Math.floor(w * h * 0.005));
  let best = null, bestScore = -1;
  for (const c of comps) {
    if (c.size < minSize) continue;
    const cw = c.maxX - c.minX + 1;
    const ch = c.maxY - c.minY + 1;
    const ar = Math.max(cw, ch) / Math.max(1, Math.min(cw, ch));
    // Prefer large components whose bbox is close to square (wafer = AR ~1,
    // text rows = AR ~10, wafer+text merged = AR ~1.5).
    const score = c.size / (ar * ar);
    if (score > bestScore) { bestScore = score; best = c; }
  }
  if (!best) {
    let largest = comps[0];
    for (const c of comps) if (c.size > largest.size) largest = c;
    best = largest;
  }
  const compMask = new Uint8Array(w * h);
  for (let k = 0; k < best.pixels.length; k++) compMask[best.pixels[k]] = 1;
  return { ...best, mask: compMask };
}

function _detect_radialEdges(mask, w, h, cx, cy) {
  const N = 96;
  const edges = [];
  const maxR = Math.hypot(w, h);
  for (let k = 0; k < N; k++) {
    const theta = (k / N) * Math.PI * 2;
    const dx = Math.cos(theta), dy = Math.sin(theta);
    let lastR = 0;
    for (let r = 1; r < maxR; r++) {
      const x = (cx + dx * r) | 0;
      const y = (cy + dy * r) | 0;
      if (x < 0 || x >= w || y < 0 || y >= h) break;
      if (mask[y * w + x]) lastR = r;
    }
    if (lastR > 0) edges.push([cx + dx * lastR, cy + dy * lastR]);
  }
  return edges;
}

function _detect_fitCircle(points) {
  const n = points.length;
  if (n < 3) return null;
  let mx = 0, my = 0;
  for (const [x, y] of points) { mx += x; my += y; }
  mx /= n; my /= n;
  let Mxx = 0, Myy = 0, Mxy = 0, Mxz = 0, Myz = 0;
  for (const [x, y] of points) {
    const dx = x - mx, dy = y - my;
    const z = dx * dx + dy * dy;
    Mxx += dx * dx; Myy += dy * dy; Mxy += dx * dy;
    Mxz += dx * z;  Myz += dy * z;
  }
  const det = Mxx * Myy - Mxy * Mxy;
  if (Math.abs(det) < 1e-10) return null;
  const a = (Myy * Mxz - Mxy * Myz) / (2 * det);
  const b = (Mxx * Myz - Mxy * Mxz) / (2 * det);
  const cx = a + mx, cy = b + my;
  let sumR = 0;
  for (const [x, y] of points) sumR += Math.hypot(x - cx, y - cy);
  return { cx, cy, r: sumR / n };
}

function _detect_sampleInteriorColor(data, w, h, cx, cy, r) {
  const samples = [];
  const ringR = r * 0.55;
  for (let k = 0; k < 24; k++) {
    const t = (k / 24) * Math.PI * 2;
    const x = Math.round(cx + Math.cos(t) * ringR);
    const y = Math.round(cy + Math.sin(t) * ringR);
    if (x < 0 || x >= w || y < 0 || y >= h) continue;
    const i = (y * w + x) * 4;
    samples.push([data[i], data[i + 1], data[i + 2]]);
  }
  if (samples.length === 0) return null;
  const rs = samples.map(s => s[0]).sort((a, b) => a - b);
  const gs = samples.map(s => s[1]).sort((a, b) => a - b);
  const bs = samples.map(s => s[2]).sort((a, b) => a - b);
  const m = samples.length >> 1;
  return `rgb(${rs[m]},${gs[m]},${bs[m]})`;
}

function _detect_circleFrom3Points(p1, p2, p3) {
  const ax = p1[0], ay = p1[1];
  const bx = p2[0], by = p2[1];
  const cx = p3[0], cy = p3[1];
  const D = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
  if (Math.abs(D) < 1e-6) return null;
  const A = ax * ax + ay * ay;
  const B = bx * bx + by * by;
  const C = cx * cx + cy * cy;
  const ux = (A * (by - cy) + B * (cy - ay) + C * (ay - by)) / D;
  const uy = (A * (cx - bx) + B * (ax - cx) + C * (bx - ax)) / D;
  return { cx: ux, cy: uy, r: Math.hypot(ux - ax, uy - ay) };
}

function _detect_boundaryPixels(mask, w, h, maxCount) {
  const points = [];
  for (let y = 1; y < h - 1; y++) {
    const row = y * w;
    for (let x = 1; x < w - 1; x++) {
      const p = row + x;
      if (!mask[p]) continue;
      if (!mask[p - 1] || !mask[p + 1] || !mask[p - w] || !mask[p + w]) {
        points.push([x, y]);
      }
    }
  }
  if (points.length <= maxCount) return points;
  const step = points.length / maxCount;
  const sub = new Array(maxCount);
  for (let i = 0; i < maxCount; i++) sub[i] = points[(i * step) | 0];
  return sub;
}

function _detect_ransacCircle(points, w, h, maxIter, tolPct) {
  const n = points.length;
  if (n < 3) return null;
  const minR = Math.min(w, h) * 0.05;
  const maxR = Math.max(w, h) * 0.8;
  let bestCircle = null, bestInliers = 0;
  for (let it = 0; it < maxIter; it++) {
    const i1 = (Math.random() * n) | 0;
    let i2 = (Math.random() * n) | 0;
    if (i2 === i1) i2 = (i2 + 1) % n;
    let i3 = (Math.random() * n) | 0;
    if (i3 === i1 || i3 === i2) i3 = (i3 + 2) % n;
    const c = _detect_circleFrom3Points(points[i1], points[i2], points[i3]);
    if (!c || c.r < minR || c.r > maxR) continue;
    const tol = Math.max(2, c.r * tolPct);
    let count = 0;
    for (let k = 0; k < n; k++) {
      const dx = points[k][0] - c.cx;
      const dy = points[k][1] - c.cy;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(d - c.r) < tol) count++;
    }
    if (count > bestInliers) {
      bestInliers = count;
      bestCircle = { cx: c.cx, cy: c.cy, r: c.r, inliers: count };
    }
  }
  return bestCircle;
}

function detectWaferCircle(data, w, h) {
  const bg = _detect_sampleBackground(data, w, h);
  const mask = _detect_buildMask(data, w, h, bg);
  const comps = _detect_allComponents(mask, w, h);
  const comp = _detect_pickWaferComponent(comps, w, h);
  if (!comp || comp.size < 200) {
    return {
      cx: w / 2, cy: h / 2, r: Math.min(w, h) / 2,
      bgColor: `rgb(${bg.r},${bg.g},${bg.b})`
    };
  }

  // RANSAC over the component's boundary pixels finds the dominant circular
  // arc even when wafer + metadata text / borders / scale bars form one
  // connected component. LSQ alone would be biased by the non-circular tail.
  const boundary = _detect_boundaryPixels(comp.mask, w, h, 1500);
  let cx, cy, r, haveFit = false;
  if (boundary.length >= 30) {
    const ransac = _detect_ransacCircle(boundary, w, h, 500, 0.025);
    if (ransac && ransac.inliers >= 20) {
      cx = ransac.cx; cy = ransac.cy; r = ransac.r;
      haveFit = true;
      const tol = Math.max(2, 0.025 * r);
      const inliers = boundary.filter(([x, y]) =>
        Math.abs(Math.hypot(x - cx, y - cy) - r) < tol);
      if (inliers.length >= 20) {
        const refit = _detect_fitCircle(inliers);
        if (refit) { cx = refit.cx; cy = refit.cy; r = refit.r; }
      }
    }
  }
  if (!haveFit) {
    cx = comp.sumX / comp.size;
    cy = comp.sumY / comp.size;
    r  = Math.min(comp.maxX - comp.minX, comp.maxY - comp.minY) / 2;
    for (let iter = 0; iter < 8; iter++) {
      const edges = _detect_radialEdges(comp.mask, w, h, cx, cy);
      if (edges.length < 16) break;
      let fit = _detect_fitCircle(edges);
      if (!fit) break;
      const dists = edges.map(p => Math.hypot(p[0] - fit.cx, p[1] - fit.cy));
      const sorted = dists.slice().sort((a, b) => a - b);
      const med = sorted[sorted.length >> 1];
      const tol = Math.max(2, 0.03 * med);
      const good = edges.filter((_, i) => Math.abs(dists[i] - med) < tol);
      if (good.length >= 16) {
        const refit = _detect_fitCircle(good);
        if (refit) fit = refit;
      }
      const dx = fit.cx - cx, dy = fit.cy - cy, dr = fit.r - r;
      cx = fit.cx; cy = fit.cy; r = fit.r;
      if (Math.abs(dx) < 0.3 && Math.abs(dy) < 0.3 && Math.abs(dr) < 0.3) break;
    }
  }
  const interior = _detect_sampleInteriorColor(data, w, h, cx, cy, r);
  return {
    cx, cy, r,
    bgColor: interior || `rgb(${bg.r},${bg.g},${bg.b})`
  };
}

function loadImgToSide(d, s) {
  saveState();
  const i = new Image();
  i.onload = () => {
    const w = i.width, h = i.height;
    const MAX_DET = 1024;
    let detW = w, detH = h, sc = 1;
    if (Math.max(w, h) > MAX_DET) {
      sc = MAX_DET / Math.max(w, h);
      detW = Math.max(1, Math.floor(w * sc));
      detH = Math.max(1, Math.floor(h * sc));
    }
    const cvs = document.createElement('canvas');
    cvs.width = detW; cvs.height = detH;
    const c = cvs.getContext('2d');
    c.drawImage(i, 0, 0, detW, detH);
    let circle;
    try {
      const data = c.getImageData(0, 0, detW, detH).data;
      circle = detectWaferCircle(data, detW, detH);
    } catch (err) {
      // Cross-origin images (e.g. an SPC map served from another host) taint the
      // canvas and block getImageData. Fall back to treating the whole image as
      // the wafer disc: it still renders + rotates, just without edge auto-fit.
      circle = { cx: detW / 2, cy: detH / 2, r: Math.min(detW, detH) / 2, bgColor: 'transparent' };
    }
    i._waferCx = circle.cx / sc;
    i._waferCy = circle.cy / sc;
    i._waferR  = circle.r  / sc;
    i._bgColor = circle.bgColor;
    waferImages[s] = i;
    updateMgrPreview(s);
    draw();
  };
  i.src = d;
}

function drawClippedWafer(targetCtx, img, cx, cy, r, rotAngle) {
  targetCtx.save();
  targetCtx.beginPath();
  targetCtx.arc(cx, cy, r, 0, Math.PI * 2);
  targetCtx.clip();

  if (img._bgColor && img._bgColor !== "transparent") {
    targetCtx.fillStyle = img._bgColor;
    targetCtx.fill();
  }

  targetCtx.translate(cx, cy);
  targetCtx.rotate(rotAngle * Math.PI / 180);

  const baseR = img._waferR || (Math.max(img.width, img.height) / 2);
  const scale = r / baseR;
  const dw = img.width * scale;
  const dh = img.height * scale;
  const offsetX = -img._waferCx * scale;
  const offsetY = -img._waferCy * scale;

  targetCtx.drawImage(img, 0, 0, img.width, img.height, offsetX, offsetY, dw, dh);
  targetCtx.restore();
}

function updateMgrPreview(s) {
  const el = document.getElementById(`pre-${s}`);
  const img = waferImages[s];
  if (!img) { el.innerHTML = "尚未載入"; return; }
  const size = 120;
  const dpr = window.devicePixelRatio || 1;
  const cvs = document.createElement('canvas');
  cvs.width = size * dpr;
  cvs.height = size * dpr;
  cvs.style.width = size + 'px';
  cvs.style.height = size + 'px';
  cvs.style.display = 'block';
  cvs.style.borderRadius = '50%';
  const pctx = cvs.getContext('2d');
  pctx.scale(dpr, dpr);
  drawClippedWafer(pctx, img, size / 2, size / 2, size / 2, 0);
  el.innerHTML = '';
  el.appendChild(cvs);
}

function selectSide(s) {
  selectedSide = s;
  document.getElementById('card-S1').classList.toggle('selected', s === 'S1');
  document.getElementById('card-S2').classList.toggle('selected', s === 'S2');
}

function clearImg(s) { saveState(); waferImages[s]=null; updateMgrPreview(s); draw(); }

async function pasteToSide(s) {
  try {
    const items = await navigator.clipboard.read();
    for (const item of items) {
      if (item.types.includes('image/png') || item.types.includes('image/jpeg')) {
        const blob = await item.getType(item.types.find(t=>t.startsWith('image/')));
        const r = new FileReader(); r.onload=(e)=>loadImgToSide(e.target.result,s); r.readAsDataURL(blob);
      }
    }
  } catch(err) {
    console.warn("Clipboard API failed, fallback to native paste event.");
    alert("瀏覽器權限受限，請直接點擊藍框框後按 Ctrl+V 貼上即可。");
  }
}

window.addEventListener('paste', (e) => {
  const isModalOpen = document.getElementById('mgrModal').style.display === 'block';
  const s = isModalOpen ? selectedSide : document.getElementById('side').value;
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      let r = new FileReader(); r.onload=(ev)=>loadImgToSide(ev.target.result,s); r.readAsDataURL(item.getAsFile()); break;
    }
  }
});

['mode', 'cass', 'side', 'station', 'offset'].forEach(id => {
  document.getElementById(id).addEventListener('change', draw);
  document.getElementById(id).addEventListener('input', draw);
});

function applyResponsiveScale() {
  const wrap = document.getElementById('main-wrap');
  const shell = document.getElementById('scale-shell');
  if (!wrap || !shell) return;
  wrap.style.transform = 'none';
  const naturalW = wrap.offsetWidth;
  const naturalH = wrap.offsetHeight;
  if (naturalW === 0) return;
  const sidePad = 24;
  const availW = window.innerWidth - sidePad;
  const k = Math.min(1, availW / naturalW);
  wrap.style.transform = `scale(${k})`;
  shell.style.height = (naturalH * k) + 'px';
}
window.addEventListener('resize', applyResponsiveScale);

// Auto-configure from URL params (opened from the NPW alarm page in an iframe):
//   ?mode=FI5.X|FI6.4 &cass=A..D &side=S1|S2 &station=LL|CHA|CHB|CHC &offset=0 &img=<map image url>
// The map image is loaded as the wafer for the given side so it renders rotated
// to the matched robot angle along the transfer path.
function wmApplyParams() {
  const q = new URLSearchParams(location.search);
  const set = (id, v) => { const el = document.getElementById(id); if (el && v != null && v !== '') el.value = v; };
  set('mode', q.get('mode'));
  set('cass', q.get('cass'));
  set('side', q.get('side'));
  set('station', q.get('station'));
  if (q.get('offset') != null) set('offset', q.get('offset'));
  draw();
  const img = q.get('img');
  if (img) loadImgToSide(img, (q.get('side') === 'S2') ? 'S2' : 'S1');
}

window.onload = () => { draw(); wmApplyParams(); applyResponsiveScale(); };
</script>
